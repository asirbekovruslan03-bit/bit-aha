<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tkinter: практические задания</title>
<style>
:root{--bg:#eef2f7;--fg:#1e293b;--card:#fff;--bd:#cbd5e1;--ac:#2563eb;--mut:#64748b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b;--bd:#334155;--ac:#60a5fa;--mut:#94a3b8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",Arial,sans-serif;min-height:100vh}
header{text-align:center;padding:28px 16px 8px}
h1{margin:0;font-size:26px}
header p{margin:6px 0 0;color:var(--mut)}
.menu{max-width:1000px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.menu button{text-align:left;padding:11px 14px;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;font:inherit;cursor:pointer}
.menu button:hover{border-color:var(--ac);color:var(--ac)}
.hint{text-align:center;color:var(--mut);padding:8px 16px 32px}
.win{position:fixed;background:#f0f0f0;color:#000;border:1px solid #555;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:96vw;max-height:92vh;display:flex;flex-direction:column;font:14px Arial,sans-serif}
.tb{background:#2563eb;color:#fff;padding:5px 8px;cursor:move;display:flex;justify-content:space-between;user-select:none;touch-action:none}
.tb .x{cursor:pointer;padding:0 4px}
.bd{padding:10px;overflow:auto;flex:1}
.b{font:inherit;padding:4px 12px;border:1px solid #888;background:#e1e1e1;color:#000;cursor:pointer}
.b:active{background:#cfcfcf}
.win input,.win select{font:inherit;padding:3px 5px;border:1px solid #888;background:#fff;color:#000}
.g{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-bottom:8px}
.r{margin-top:8px;font-weight:bold}
.c{text-align:center}
table.t{border-collapse:collapse;width:100%}
table.t td,table.t th{border:2px outset #ddd;padding:6px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Практические задания (25)</h1>
  <p>Организация и оформление GUI: pack, grid, цвета — версия для браузера</p>
</header>
<div class="menu" id="menu"></div>
<p class="hint">Нажмите на задание — оно откроется в отдельном окне. Окна можно перетаскивать за заголовок.</p>

<script>
const E=(t,p={},par)=>{const s=p.s;delete p.s;const e=Object.assign(document.createElement(t),p);if(s)e.style.cssText=s;par&&par.append(e);return e};
const btn=(txt,fn,par,s)=>E('button',{className:'b',textContent:txt,onclick:fn,s},par);
let z=10,n=0;
function win(title,w,h,bg){
  const e=E('div',{className:'win'},document.body);
  e.style.cssText=`width:${w}px;height:${h+30}px;left:${16+(n%8)*28}px;top:${16+(n++%8)*28}px;z-index:${++z}`;
  const tb=E('div',{className:'tb'},e);
  E('span',{textContent:title},tb);
  E('b',{className:'x',textContent:'✕',onclick:()=>e.remove()},tb);
  const b=E('div',{className:'bd'},e);
  if(bg)b.style.background=bg;
  e.onpointerdown=()=>e.style.zIndex=++z;
  tb.onpointerdown=ev=>{
    if(ev.target.className==='x')return;
    const dx=ev.clientX-e.offsetLeft,dy=ev.clientY-e.offsetTop;
    tb.setPointerCapture(ev.pointerId);
    tb.onpointermove=m=>{e.style.left=Math.max(0,m.clientX-dx)+'px';e.style.top=Math.max(0,m.clientY-dy)+'px'};
    tb.onpointerup=()=>{tb.onpointermove=null};
  };
  return b;
}
// форма: поля + кнопка + результат
function form(b,fields,bt,fn){
  const g=E('div',{className:'g'},b);
  const ins=fields.map(f=>{E('label',{textContent:f[0]},g);return E('input',{type:f[1]||'text'},g)});
  btn(bt,()=>fn(ins.map(i=>i.value.trim()),r,ins),b);
  const r=E('div',{className:'r'},b);
  return{ins,r};
}
const T=[];
const add=(name,fn)=>T.push([name,fn]);

add('Создание простого окна',()=>win('Моя программа',300,200));
add('Настройка размера окна',()=>win('Окно 600x400',600,400,'lightblue'));
add('Размещение текста',()=>{const b=win('Label',500,200);E('div',{className:'c',textContent:'Добро пожаловать на урок программирования!',s:'font-size:18px;margin-top:50px'},b)});
add('Создание кнопки',()=>{const b=win('Кнопка',300,150);let c=0;const r=E('div',{className:'c'});
  btn('Нажмите',()=>r.textContent='Нажато раз: '+(++c),E('div',{className:'c',s:'margin:15px'},b));b.append(r)});
add('Метод pack()',()=>{const b=win('pack()',400,200);
  btn('TOP',0,E('div',{className:'c'},b));
  const m=E('div',{s:'display:flex;justify-content:space-between;align-items:center;height:110px'},b);
  btn('LEFT',0,m);btn('RIGHT',0,m)});
add('Метод grid()',()=>{const b=win('grid()',300,220);const g=E('div',{s:'display:grid;grid-template-columns:repeat(3,1fr);gap:6px'},b);
  for(let i=1;i<=9;i++)btn(i,0,g,'height:44px')});
add('Изменение цветов',()=>{const b=win('Цвета',450,120);const d=E('div',{s:'display:flex;gap:10px;margin-top:20px'},b);
  [['Красная','red'],['Зелёная','green'],['Синяя','blue'],['Жёлтая','gold']].forEach(([t,c])=>btn(t,0,d,`background:${c};color:#fff;flex:1;height:40px`))});
add('Настройка шрифтов',()=>{const b=win('Шрифты',500,200);b.className+=' c';
  E('div',{textContent:'Привет, Tkinter!',s:'font:italic bold 28px "Times New Roman",serif;margin:12px'},b);
  E('div',{textContent:'Courier, 14',s:'font:14px "Courier New",monospace'},b);
  E('div',{textContent:'Arial, 18, underline',s:'font:18px Arial;text-decoration:underline;margin:10px'},b)});
add('Поле для ввода',()=>{const b=win('Entry',300,120);b.className+=' c';E('div',{textContent:'Имя пользователя:',s:'margin:6px'},b);E('input',{size:25},b)});
add('Вывод приветствия',()=>{const b=win('Приветствие',300,160);b.className+=' c';
  const i=E('input',{s:'margin:10px'},b);E('br',{},b);const r=E('div',{className:'r',s:'font-size:16px'});
  btn('Приветствие',()=>{const v=i.value.trim();r.textContent=v?`Привет, ${v}!`:'Введите имя!'},b);b.append(r)});
add('Форма регистрации',()=>form(win('Регистрация',380,230),[['ФИО'],['Возраст'],['Телефон']],'Зарегистрировать',(v,r)=>{
  r.textContent=(!v[0]||!/^\d+$/.test(v[1])||!v[2])?'Заполните все поля (возраст — число)!':`Зарегистрирован: ${v[0]}, ${v[1]} лет, тел. ${v[2]}`}));
add('Анкета (grid)',()=>form(win('Анкета',380,240),[['Имя'],['Фамилия'],['Группа'],['Специальность']],'Показать',(v,r)=>r.textContent=v.map(x=>x||'—').join(' | ')));
add('Калькулятор',()=>{const b=win('Калькулятор',260,330);
  const d=E('input',{s:'width:100%;font-size:20px;text-align:right;margin-bottom:6px'},b);
  const g=E('div',{s:'display:grid;grid-template-columns:repeat(4,1fr);gap:4px'},b);
  '789/456*123-0.=+'.split('').forEach(k=>btn(k,()=>{
    if(k==='='){try{const s=d.value;if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;const v=Function('"use strict";return ('+s+')')();d.value=Number.isFinite(v)?v:'Ошибка'}catch{d.value='Ошибка'}}
    else d.value+=k},g,'height:44px'));
  btn('C',()=>d.value='',b,'width:100%;margin-top:4px')});
add('Окно авторизации',()=>{const f=form(win('Авторизация',300,180),[['Логин'],['Пароль','password']],'Войти',(v,r)=>{
  const ok=v[0]==='admin'&&v[1]==='1234';r.textContent=ok?'Добро пожаловать!':'Неверный логин или пароль';r.style.color=ok?'green':'red'})});
add('Изменение цвета текста',()=>{const b=win('Цвет текста',420,160);
  const l=E('div',{textContent:'Меняйте цвет этого текста',s:'font-size:20px;margin:15px 0'},b);
  [['Красный','red'],['Зелёный','green'],['Синий','blue']].forEach(([t,c])=>btn(t,()=>l.style.color=c,b,'margin-right:10px'))});
add('Изменение цвета фона',()=>{const b=win('Цвет фона',400,150);
  ['red','green','blue'].forEach(c=>btn('',()=>b.style.background=c,b,`background:${c};width:90px;height:30px;margin-right:10px`))});
add('Программа-счётчик',()=>{const b=win('Счётчик',250,180);let c=0;b.className+=' c';
  const l=E('div',{textContent:0,s:'font-size:44px;margin:10px'},b);
  btn('−',()=>l.textContent=--c,b,'width:60px;margin:0 14px');btn('+',()=>l.textContent=++c,b,'width:60px;margin:0 14px')});
add('Список задач',()=>{const b=win('Список задач',350,320);b.className+=' c';
  const i=E('input',{size:28},b);E('br',{},b);
  const l=E('select',{size:10,s:'width:90%;margin:8px 0'});
  const a=()=>{const v=i.value.trim();if(v){E('option',{textContent:v},l);i.value=''}};
  i.onkeydown=e=>e.key==='Enter'&&a();
  btn('Добавить',a,b,'margin-top:8px');E('br',{},b);b.append(l);E('br',{},b);
  btn('Удалить выбранную',()=>[...l.selectedOptions].forEach(o=>o.remove()),b)});
add('Система оценивания',()=>form(win('Оценивание',380,200),[['Имя студента'],['Баллы (0–100)']],'Проверить',(v,r)=>{
  const s=Number(v[1]);if(!v[1]||!Number.isInteger(s)||s<0||s>100)return r.textContent='Введите имя и баллы 0–100';
  r.textContent=`${v[0]}: ${s} баллов — оценка ${s>=90?5:s>=75?4:s>=60?3:2}`}));
add('Информация о студенте',()=>{const b=win('Информация',380,180);
  E('div',{className:'c',textContent:'Информация о студенте',s:'font-size:18px;font-weight:bold;margin:8px'},b);
  const g=E('div',{className:'g'},b);
  [['ФИО:','Иванов Иван Иванович'],['Группа:','ИС-21'],['Предмет:','Программирование на Python']].forEach(([k,v])=>{E('b',{textContent:k,s:'text-align:right'},g);E('span',{textContent:v},g)})});
add('Интерфейс магазина',()=>form(win('Магазин',380,220),[['Название товара'],['Цена'],['Количество']],'Рассчитать',(v,r)=>{
  const p=parseFloat(v[1]),q=parseInt(v[2]);if(isNaN(p)||isNaN(q))return r.textContent='Проверьте введённые данные';
  r.textContent=`${v[0]}: ${v[1]} × ${v[2]} = ${(p*q).toFixed(2)}`}));
add('Оформление регистрации',()=>{const b=win('Регистрация',400,300,'#1e293b');b.style.color='#fff';b.style.fontFamily='Verdana,sans-serif';
  const f=form(b,[['Логин'],['E-mail'],['Пароль','password'],['Повтор пароля','password']],'Зарегистрироваться',(v,r)=>{
    r.textContent=(!v[0]||!v[2])?'Заполните логин и пароль':v[2]!==v[3]?'Пароли не совпадают':'Регистрация успешна!'});
  const x=b.querySelector('.b');x.style.cssText='background:#22c55e;color:#fff;font-size:15px;font-weight:bold;width:100%;height:44px;border:0;margin-top:6px';f.r.style.color='#fde68a'});
add('Многооконная программа',()=>{const b=win('Главное окно',400,250);b.className+=' c';
  btn('Открыть окно',()=>{const w=win('Информация',300,150);w.className+=' c';
    E('div',{textContent:'Это дополнительное окно (Toplevel).',s:'margin:20px'},w);btn('Закрыть',()=>w.closest('.win').remove(),w)},b,'margin-top:30px')});
add('Расписание занятий',()=>{const b=win('Расписание',760,260);
  const S=[['Понедельник','#fecaca','Математика,Информатика,Физика,Английский'],['Вторник','#fed7aa','Python,История,Математика,Физкультура'],
  ['Среда','#fef08a','Базы данных,Python,Английский,Физика'],['Четверг','#bbf7d0','Информатика,Сети,Python,Философия'],['Пятница','#bfdbfe','Проект,Математика,Базы данных,Классный час']];
  const t=E('table',{className:'t'},b);
  t.innerHTML='<tr><th>День</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>'+S.map(([d,c,l])=>`<tr style="background:${c}"><td><b>${d}</b></td>${l.split(',').map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')});
add('Итог: система учёта студентов',()=>{const b=win('Учёт студентов',720,520);const st=[];
  const f=form(b,[['ФИО'],['Группа'],['Специальность'],['Оценки (через пробел)']],'Добавить',(v,r,ins)=>{
    const m=v[3].split(/\s+/).map(Number);
    if(!v[3]||m.some(x=>!Number.isInteger(x)||x<1||x>5)){r.style.color='red';return r.textContent='Оценки — числа от 1 до 5 через пробел'}
    if(!v[0]||!v[1]||!v[2]){r.style.color='red';return r.textContent='Заполните все поля'}
    st.push([...v.slice(0,3),m.join(' '),(m.reduce((a,c)=>a+c,0)/m.length).toFixed(2)]);ins.forEach(i=>i.value='');
    r.style.color='green';r.textContent='Студент добавлен';draw()});
  const tb=E('table',{className:'t',s:'margin-top:10px'},b);
  const draw=()=>{tb.innerHTML='<tr><th>ФИО</th><th>Группа</th><th>Специальность</th><th>Оценки</th><th>Средний</th><th></th></tr>'+
    st.map((s,i)=>`<tr>${s.map(x=>`<td>${x}</td>`).join('')}<td><button class="b" data-i="${i}">✕</button></td></tr>`).join('')};
  tb.onclick=e=>{const i=e.target.dataset.i;if(i!==undefined){st.splice(i,1);draw()}};draw()});

T.forEach(([name,fn],i)=>E('button',{textContent:`${i+1}. ${name}`,onclick:fn},$m=document.getElementById('menu')));
</script>
</body>
</html>
